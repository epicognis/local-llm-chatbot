<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Chatbot</title>
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>

<!-- ── Left sidebar ── -->
<button id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
<div id="sidebar-backdrop" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <h3>Model</h3>
  <select id="model-picker"></select>

  <button id="new-session-btn" onclick="newSession()">+ New Session</button>

  <h3>Sessions</h3>
  <div id="session-list"></div>
</div>

<!-- ── Main chat pane ── -->
<div id="main">
  <div id="transcript"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="3"
      placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="stop-btn" onclick="stopStreaming()" hidden>Stop</button>
  </div>
</div>

<script>
  const DEFAULT_MODEL = {{ default_model | tojson }};

  let currentSessionId = null;
  let isStreaming = false;
  let activeController = null;   // AbortController for the in-flight /chat request
  let stopRequested = false;

  // crypto.randomUUID() only exists in secure contexts (HTTPS or localhost);
  // this app is served over plain HTTP on the LAN for phone access, so fall
  // back to a manual UUID v4 when it's unavailable.
  function newUUID() {
    if (window.crypto && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  // ── Bootstrap ──────────────────────────────────────────

  async function init() {
    await loadModels();
    await loadSessions();
    newSession({ collapse: false });
    collapseSidebar(); // start collapsed on phones so the input isn't hidden under the overlay
    document.getElementById('model-picker').addEventListener('change', e => {
      try { localStorage.setItem('model', e.target.value); } catch (_) {}
      collapseSidebar();
    });
  }

  // ── Sidebar collapse (mobile) ──────────────────────────

  function isMobile() {
    return window.matchMedia('(max-width: 700px)').matches;
  }

  function collapseSidebar() {
    if (isMobile()) document.body.classList.add('sidebar-collapsed');
  }

  function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }

  async function loadModels() {
    const res = await fetch('/models');
    const models = await res.json();
    const picker = document.getElementById('model-picker');
    let saved = null;
    try { saved = localStorage.getItem('model'); } catch (_) {}
    const preferred = models.some(m => m.name === saved) ? saved : DEFAULT_MODEL;
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = `${m.name} (ctx-${m.default_ctx})`;
      if (m.name === preferred) opt.selected = true;
      picker.appendChild(opt);
    });
  }

  async function loadSessions() {
    const res = await fetch('/sessions');
    const sessions = await res.json();
    const list = document.getElementById('session-list');
    list.innerHTML = '';
    sessions.forEach(({ session_id: sid, name }) => {
      const div = document.createElement('div');
      div.className = 'session-item' + (sid === currentSessionId ? ' active' : '');
      div.title = sid;

      const label = document.createElement('span');
      label.className = 'session-label';
      label.textContent = name || (sid.slice(0, 8) + '…');
      label.onclick = () => openSession(sid);
      div.appendChild(label);

      const renameBtn = document.createElement('button');
      renameBtn.className = 'session-action';
      renameBtn.textContent = '✎';
      renameBtn.title = 'Rename session';
      renameBtn.onclick = (e) => { e.stopPropagation(); renameSession(sid, name); };
      div.appendChild(renameBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'session-action';
      deleteBtn.textContent = '🗑';
      deleteBtn.title = 'Delete session';
      deleteBtn.onclick = (e) => { e.stopPropagation(); deleteSession(sid); };
      div.appendChild(deleteBtn);

      list.appendChild(div);
    });
  }

  async function renameSession(sid, currentName) {
    const name = prompt('Session name:', currentName || '');
    if (name === null) return;
    await fetch(`/sessions/${sid}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    loadSessions();
  }

  async function deleteSession(sid) {
    if (!confirm('Delete this session? This cannot be undone.')) return;
    await fetch(`/sessions/${sid}`, { method: 'DELETE' });
    if (sid === currentSessionId) newSession({ collapse: false });
    else loadSessions();
  }

  // ── Session management ─────────────────────────────────

  function newSession({ collapse = true } = {}) {
    currentSessionId = newUUID();
    document.getElementById('transcript').innerHTML = '';
    loadSessions();
    if (collapse) collapseSidebar();
  }

  async function openSession(sid) {
    currentSessionId = sid;
    const res = await fetch(`/sessions/${sid}/turns`);
    const turns = await res.json();
    const transcript = document.getElementById('transcript');
    transcript.innerHTML = '';
    turns.forEach(t => appendMessage(t.role, t.content));
    highlightActive();
    collapseSidebar();
  }

  function highlightActive() {
    document.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.title === currentSessionId);
    });
  }

  // ── Transcript helpers ─────────────────────────────────

  function appendMessage(role, content) {
    const transcript = document.getElementById('transcript');
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    wrap.appendChild(bubble);
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;
    return bubble;
  }

  // ── Send & stream ──────────────────────────────────────

  function setStreaming(on) {
    isStreaming = on;
    document.getElementById('send-btn').hidden = on;
    document.getElementById('stop-btn').hidden = !on;
  }

  function stopStreaming() {
    if (!activeController) return;
    stopRequested = true;
    activeController.abort();   // server sees the disconnect and aborts the Ollama call
  }

  function showError(bubble, text) {
    const err = document.createElement('div');
    err.className = 'error-note';
    err.textContent = text;
    bubble.appendChild(err);
  }

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('msg-input');
    const message = input.value.trim();
    if (!message) return;
    if (!currentSessionId) currentSessionId = newUUID();

    input.value = '';
    appendMessage('user', message);

    const model = document.getElementById('model-picker').value;
    const aiBubble = appendMessage('assistant', '');
    aiBubble.classList.add('streaming');
    const transcript = document.getElementById('transcript');
    const textNode = document.createTextNode('');
    aiBubble.appendChild(textNode);

    setStreaming(true);
    stopRequested = false;

    // Watchdog: the server sends a keepalive at least every few seconds while
    // a turn is in progress, so a minute of total silence means it's gone.
    const controller = new AbortController();
    activeController = controller;
    let watchdog;
    const resetWatchdog = () => {
      clearTimeout(watchdog);
      watchdog = setTimeout(() => controller.abort(), 60000);
    };
    resetWatchdog();

    const handleEvent = (event) => {
      if (event.type === 'status') {
        if (!textNode.data) {
          aiBubble.dataset.status = '⏳ ' + event.text;
          aiBubble.classList.add('status');
        }
      } else if (event.type === 'token') {
        aiBubble.classList.remove('status');
        textNode.data += event.text;
      } else if (event.type === 'error') {
        aiBubble.classList.remove('status');
        showError(aiBubble, event.text);
      }
      transcript.scrollTop = transcript.scrollHeight;
    };

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, message, model }),
        signal: controller.signal,
      });
      if (!response.ok) {
        let detail = `HTTP ${response.status}`;
        try { detail += ': ' + JSON.stringify((await response.json()).detail); } catch (_) {}
        throw new Error(detail);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        resetWatchdog();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;   // blank separators, ": keepalive"
          const raw = line.slice(6);
          if (raw === '[DONE]') continue;
          try { handleEvent(JSON.parse(raw)); } catch (_) { /* skip malformed chunk */ }
        }
      }
    } catch (err) {
      aiBubble.classList.remove('status');
      if (err.name === 'AbortError') {
        if (stopRequested) aiBubble.classList.add('stopped');
        else showError(aiBubble, 'No response from the server for 60 seconds — giving up. The server may be stuck; try again.');
      } else {
        showError(aiBubble, 'Connection error: ' + err.message);
      }
    } finally {
      clearTimeout(watchdog);
      activeController = null;
      aiBubble.classList.remove('streaming', 'status');
      if (!textNode.data && !aiBubble.querySelector('.error-note') && !stopRequested) {
        showError(aiBubble, 'Empty response.');
      }
      setStreaming(false);
      loadSessions(); // refresh list (new session appears)
    }
  }

  document.getElementById('msg-input').addEventListener('focus', collapseSidebar);

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  init();
</script>
</body>
</html>
